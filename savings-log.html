<!DOCTYPE html>
<html>
  <head>
    <link rel="icon" type="image/png" href="favicon/favicon.png">
    <title>Savings Log</title>
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/background.css">
    <link rel="stylesheet" href="styles/splitting.css">

    <style>
      body{
        margin:5%;
      }
      .main{
        z-index: 10;
      }
      .savings-statement{
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .statement{
        margin-right: 10px;
        font-size: 36px;
      }

      .line-middle{
        position: fixed;
        top: 26px;
        bottom: 26px;
        left: 50%;
        width: 1px;
        height: auto;
        margin: 0;
        padding: 0;
        border: 0;
        background: #f5f5f5;
        z-index: 5;
        mix-blend-mode: difference;
        pointer-events: none;
      }

      .savings-log-form{
        position: absolute;
        top: 0;
        left: 0;
        width: calc(50% - 16px);
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .savings-log-fields{
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .savings-log-amount{
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .savings-log-form .statement{
        margin-right: 0;
        color: #f5f5f5;
        font-family: myFont;
        font-size: 36px;
        width: auto;
        text-align: left;
      }

      .savings-log-input{
        width: min(150px, 100%);
        height: 45px;
        field-sizing: fixed;
        margin-left: 0;
      }

      .log-saving-button{
        align-self: flex-start;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        column-gap: 10px;
        align-items: start;
        min-width: 0;
        font-size: 36px;
        transition: font-weight 150ms ease-in-out;
      }

      .log-saving-button:hover{
        font-weight: 800;
      }

      .log-saving-button .arrow-bullet{
        line-height: normal;
      }

      .home-link{
        position: absolute;
        left: 0;
        bottom: 0;
        color: #f5f5f5;
        font-family: myFont;
        text-decoration: none;
      }

      .home-transition-overlay{
        position: fixed;
        inset: 0;
        z-index: 250;
        background: #000;
        opacity: 0;
        pointer-events: none;
      }

      .savings-summary-column{
        position: absolute;
        top: 0;
        right: 0;
        width: calc(50% - 24px);
        display: flex;
        flex-direction: column;
        gap: 28px;
        color: #f5f5f5;
        font-family: myFont;
        z-index: 20;
      }

      .savings-history{
        width: 100%;
      }

      .savings-history-title{
        margin-bottom: 12px;
        font-size: 24px;
        font-weight: 400;
      }

      .savings-history table{
        width: 100%;
        border-collapse: collapse;
        font-size: 18px;
        text-align: left;
      }

      .savings-history th,
      .savings-history td{
        position: relative;
        padding: 7px 0;
        border-bottom: 0;
      }

      .savings-history thead th::after,
      .savings-history tbody td::after{
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: rgb(245 245 245 / 70%);
        mix-blend-mode: difference;
        pointer-events: none;
      }

      .savings-history th:last-child,
      .savings-history td:last-child{
        text-align: right;
      }

      .savings-history tfoot th{
        padding-top: 12px;
        border-bottom: 0;
        font-weight: 700;
      }

      .empty-savings-log{
        opacity: 0.75;
      }

      @media (max-width: 700px){
        .main{
          gap: 28px;
        }

        .line-middle{
          display: none;
        }

        .savings-log-form{
          position: static;
          width: 100%;
          align-items: flex-start;
        }

        .savings-statement{
          flex-wrap: wrap;
        }

        .savings-log-fields{
          justify-content: flex-start;
        }

        .savings-log-form .statement{
          text-align: left;
        }

        .savings-summary-column{
          position: static;
          width: 100%;
        }

        .goal-tally{
          position: static;
          width: 100%;
          margin-bottom: 28px;
        }
      }

      .goal-tally{
        width: 100%;
        color: #f5f5f5;
        font-family: myFont;
        text-align: left;
      }

      .goal-tally-label{
        margin: 0 0 8px;
        font-size: 36px;
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      .goal-progress-value{
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
      }

      .no-goal-overlay[hidden]{
        display: none;
      }

      .no-goal-overlay{
        position: fixed;
        inset: 0;
        z-index: 250;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #f5f5f5;
        font-family: myFont;
        text-align: center;
        opacity: 0;
        pointer-events: none;
      }

      .no-goal-content{
        position: relative;
        isolation: isolate;
        width: min(34rem, 90vw);
      }

      .no-goal-content::before{
        content: "";
        position: absolute;
        z-index: -1;
        inset: -30vh -36vw;
        border-radius: 50%;
        background: rgb(21 21 21);
        filter: blur(70px);
      }

      .no-goal-message{
        font-size: 36px;
        font-weight: 400;
        line-height: 1.25;
      }

      .set-goal-link{
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        column-gap: 10px;
        align-items: start;
        width: fit-content;
        margin: 24px auto 0;
        color: #f5f5f5;
        font-size: 36px;
        line-height: normal;
        text-align: left;
        text-decoration: none;
        transition: font-weight 150ms ease-in-out, opacity 700ms ease;
        opacity: 0;
        pointer-events: none;
      }

      .set-goal-link.is-visible{
        opacity: 1;
        pointer-events: auto;
      }

      .set-goal-link:hover{
        font-weight: 800;
      }

      .set-goal-link .arrow-bullet{
        font-size: 36px;
        line-height: normal;
      }

      @media (max-width: 700px){
        .goal-tally{
          width: 90%;
          text-align: left;
        }

        .goal-tally-label{
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-entry" aria-hidden="true"></div>
    <hr class="line-top">
    <hr class="line-middle">
    <div class="main">
      <form class="savings-log-form" id="savings-log-form">
        <div class="savings-log-fields">
          <label class="statement" for="savings-amount">Today I saved</label>
          <div class="savings-log-amount">
            <span class="statement" aria-hidden="true">$</span>
            <span class="input-underline">
              <input class="input-field savings-log-input" id="savings-amount" type="text" inputmode="decimal" autocomplete="off" aria-label="Savings amount">
            </span>
          </div>
        </div>
        <button class="log-saving-button" type="submit">
          <span class="arrow-bullet" aria-hidden="true">&gt;</span>Add
        </button>
      </form>
      <a class="log-saving-button home-link" href="home.html">
        <span class="arrow-bullet" aria-hidden="true">&gt;</span>Home
      </a>
      <div class="savings-summary-column">
        <aside class="goal-tally" aria-label="Your savings goal progress" hidden>
          <p class="goal-tally-label"></p>
          <p class="goal-progress-value"></p>
        </aside>
          <section class="savings-history" aria-labelledby="savings-history-title">
            <h2 class="savings-history-title" id="savings-history-title">My History</h2>
            <table>
              <thead>
                <tr><th scope="col">Date</th><th scope="col">Saved</th></tr>
              </thead>
              <tbody class="savings-history-body"></tbody>
              <tfoot>
                <tr><th scope="row">Total</th><th class="savings-history-total">$0.00</th></tr>
              </tfoot>
            </table>
          </section>
      </div>
    </div>
    <div class="home-transition-overlay" aria-hidden="true"></div>
    <div class="no-goal-overlay" hidden>
      <div class="no-goal-content">
        <p class="no-goal-message" role="status">You haven't set a goal yet.</p>
        <a class="set-goal-link" href="goal-manager.html">
          <span class="arrow-bullet" aria-hidden="true">&gt;</span>I'll set one now.
        </a>
      </div>
    </div>
    <hr class="line-bottom">
    <div class="blob-scene" aria-hidden="true">
      <div class="blob blob-one"></div>
      <div class="blob blob-two"></div>
      <div class="blob blob-three"></div>
      <div class="blur-overlay"></div>
      <div class="noise"></div>
    </div>

    <script>
      const goalStorageKey = "goal-manager.goal";
      const goalTally = document.querySelector(".goal-tally");
      const goalTallyLabel = document.querySelector(".goal-tally-label");
      const goalProgressValue = document.querySelector(".goal-progress-value");
      const savingsForm = document.querySelector(".savings-log-form");
      const savingsInput = document.querySelector(".savings-log-input");
      const savingsHistoryBody = document.querySelector(".savings-history-body");
      const savingsHistoryTotal = document.querySelector(".savings-history-total");
      const savingsLogStorageKey = "savings-log.entries";
      const noGoalOverlay = document.querySelector(".no-goal-overlay");
      const noGoalLink = document.querySelector(".set-goal-link");
      const homeLink = document.querySelector(".home-link");
      const homeTransitionOverlay = document.querySelector(".home-transition-overlay");

      homeLink.addEventListener("click", async event => {
        event.preventDefault();
        homeLink.style.pointerEvents = "none";
        const destination = homeLink.href;

        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          const fadeOptions = { duration: 800, easing: "ease-in-out", fill: "forwards" };
          const elementsToFade = [
            document.querySelector(".main"),
            document.querySelector(".line-top"),
            document.querySelector(".line-bottom"),
            document.querySelector(".line-middle"),
            document.querySelector(".blob-scene"),
            homeTransitionOverlay,
          ].filter(Boolean);

          await Promise.all(elementsToFade.map(element => element.animate(
            [{ opacity: getComputedStyle(element).opacity }, { opacity: element === homeTransitionOverlay ? 1 : 0 }],
            fadeOptions
          ).finished));
        }

        window.location.href = destination;
      });

      let savingsEntries = [];
      try {
        const storedEntries = JSON.parse(localStorage.getItem(savingsLogStorageKey));
        if (Array.isArray(storedEntries)) savingsEntries = storedEntries;
      } catch {}

      let savedGoal;
      try {
        savedGoal = JSON.parse(localStorage.getItem(goalStorageKey));
      } catch {}

      function renderSavingsHistory(){
        const totalsByDate = new Map();
        savingsEntries.forEach(entry => {
          if (typeof entry.date !== "string" || !Number.isFinite(Number(entry.amount))) return;
          totalsByDate.set(entry.date, (totalsByDate.get(entry.date) || 0) + Number(entry.amount));
        });

        const dailyTotals = [...totalsByDate.entries()].sort(([dateA], [dateB]) => dateB.localeCompare(dateA));
        savingsHistoryBody.replaceChildren();
        if (dailyTotals.length === 0) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 2;
          cell.className = "empty-savings-log";
          cell.textContent = "No savings logged yet.";
          row.append(cell);
          savingsHistoryBody.append(row);
        } else {
          dailyTotals.forEach(([date, amount]) => {
            const row = document.createElement("tr");
            const dateCell = document.createElement("td");
            const amountCell = document.createElement("td");
            dateCell.textContent = new Date(`${date}T00:00:00`).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
            amountCell.textContent = `$${amount.toFixed(2)}`;
            row.append(dateCell, amountCell);
            savingsHistoryBody.append(row);
          });
        }

        const total = dailyTotals.reduce((sum, [, amount]) => sum + amount, 0);
        savingsHistoryTotal.textContent = `$${total.toFixed(2)}`;

        if (savedGoal
          && ["week", "month", "year"].includes(savedGoal.timeframe)
          && typeof savedGoal.amount === "string"
          && savedGoal.amount.trim() !== ""
          && Number.isFinite(Number(savedGoal.amount))) {
          const target = Number(savedGoal.amount);
          const percentSaved = target > 0 ? Math.round(total / target * 100) : 0;
          goalTallyLabel.textContent = `I want to save $${savedGoal.amount} in a ${savedGoal.timeframe}.`;
          goalProgressValue.textContent = `I've saved ${percentSaved}% of my goal!`;
          goalTally.hidden = false;
        }
      }

      renderSavingsHistory();

      savingsInput.addEventListener("input", () => {
        const numericText = savingsInput.value.replace(/[^\d.]/g, "");
        const decimalIndex = numericText.indexOf(".");
        savingsInput.value = decimalIndex === -1
          ? numericText
          : numericText.slice(0, decimalIndex + 1) + numericText.slice(decimalIndex + 1).replace(/\./g, "");
      });

      savingsForm.addEventListener("submit", event => {
        event.preventDefault();
        const amount = savingsInput.value.trim();
        if (!amount || !Number.isFinite(Number(amount))) return;

        savingsEntries.push({ date: new Date().toLocaleDateString("en-CA"), amount });
        try {
          localStorage.setItem(savingsLogStorageKey, JSON.stringify(savingsEntries));
        } catch {}
        renderSavingsHistory();
        savingsInput.value = "";
        savingsInput.focus();
      });

      if (savedGoal
        && ["week", "month", "year"].includes(savedGoal.timeframe)
        && typeof savedGoal.amount === "string"
        && savedGoal.amount.trim() !== ""
        && Number.isFinite(Number(savedGoal.amount))) {
        renderSavingsHistory();
      } else {
        noGoalOverlay.hidden = false;
        const messageFade = noGoalOverlay.animate(
          [{ opacity: 0 }, { opacity: 1 }],
          { duration: 800, easing: "ease-out", fill: "forwards" }
        );
        messageFade.finished.then(() => {
          window.setTimeout(() => noGoalLink.classList.add("is-visible"), 300);
        });
      }
    </script>
    <script src="scripts/splitting.js"></script>
    <script src="scripts/blob-targeting.js"></script>
    <script src="scripts/custom-cursor.js"></script>
  </body>
</html>
