<!DOCTYPE html>
 <html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon/favicon.png">
    <title>mockup</title>
    <link rel="stylesheet" href="styles/animation.css">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/background.css">
    <link rel="stylesheet" href="styles/splitting.css">
    <style>
      body::before {
        content: none;
      }

      .blob-scene .blob-one {
        animation-duration: 8s;
      }

      .blob-scene .blob-two {
        animation-duration: 10s;
      }

      .blob-scene .blob-three {
        animation-duration: 12s;
      }

      .mockup-question,
      .followup-question,
      .brand-question {
        position: fixed;
        top: 50%;
        left: 50%;
        z-index: 1;
        width: 100%;
        max-width: 1044px;
        margin: 0;
        padding: 32px;
        color: var(--text);
        font-family: myFont;
        font-size: 52px;
        font-weight: 400;
        line-height: 1.15;
        text-align: center;
        transform: translate(-50%, -50%);
        --typewriter-step: 45ms;
      }

      .mockup-question {
        animation: slide-up-and-fade 1575ms ease-in-out calc(2s + (var(--char-total) - 1) * var(--typewriter-step) + 2s + 1ms) forwards;
      }

      .followup-question {
        opacity: 0;
        visibility: hidden;
      }

      .followup-question.is-active {
        opacity: 1;
        visibility: visible;
      }

      .mockup-question .char {
        opacity: 0;
        animation: typewriter-reveal 1ms linear forwards;
        animation-delay: calc(2s + var(--char-index) * var(--typewriter-step));
      }

      .followup-question .char {
        opacity: 0;
      }

      .followup-question.is-active .char {
        animation: typewriter-reveal 1ms linear forwards;
        animation-delay: calc(var(--char-index) * var(--typewriter-step));
      }

      .brand-question .char {
        opacity: 0;
      }

      .brand-question.is-active .char {
        animation: typewriter-reveal 1ms linear forwards;
        animation-delay: calc(var(--char-index) * var(--typewriter-step));
      }

      .followup-question.is-leaving {
        animation: followup-slide-up 1575ms ease-in forwards;
      }

      .brand-question {
        margin-top:-20px;
        font-size: 120px;
        opacity: 0;
        visibility: hidden;
      }

      .brand-question.is-active {
        opacity: 1;
        visibility: visible;
      }

      @keyframes typewriter-reveal {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slide-up-and-fade {
        from {
          top: 50%;
          opacity: 1;
        }
        to {
          top: 16.6667%;
          opacity: 0;
        }
      }

      @keyframes followup-slide-up {
        to {
          top: calc(50% - var(--followup-shift));
        }
      }

      @media (max-width: 600px) {
        .mockup-question,
        .followup-question,
        .brand-question {
          box-sizing: border-box;
          padding: 10px 46px;
          font-size: 34px;
        }

        .brand-question {
          font-size: 64px;
        }
      }

      @media (max-width: 360px) {
        .mockup-question,
        .followup-question,
        .brand-question {
          box-sizing: border-box;
          padding: 30px 46px;
          font-size: 28px;
        }

        .brand-question {
          margin: 0 ;
          font-size: 48px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mockup-question {
          top: 50%;
          animation: slide-up-and-fade 1ms linear 0ms forwards;
        }

        .mockup-question .char,
        .followup-question.is-active .char,
        .brand-question.is-active .char {
          opacity: 1;
          animation: none;
        }

        .followup-question.is-leaving {
          animation: followup-slide-up 1ms linear forwards;
        }
      }
    </style>
      <script src="scripts/theme.js"></script>
  </head>
  <body>
    <h1 class="mockup-question">How much money could you be saving online?</h1>
    <h1 class="followup-question">Start saving today with</h1>
    <h1 class="brand-question">Zen Log</h1>

    <div class="blob-scene" aria-hidden="true">
      <div class="blob blob-one"></div>
      <div class="blob blob-two"></div>
      <div class="blob blob-three"></div>
      <div class="blur-overlay"></div>
      <div class="noise"></div>
    </div>

    <script src="scripts/blob-targeting.js"></script>
    <script src="scripts/custom-cursor.js"></script>
    <script src="scripts/splitting.js"></script>
    <script>
      const question = document.querySelector('.mockup-question');
      const followup = document.querySelector('.followup-question');
      const brand = document.querySelector('.brand-question');

      question.addEventListener('animationend', event => {
        if (event.animationName !== 'slide-up-and-fade') return;

        question.hidden = true;
        followup.classList.add('is-active');
        Splitting({ target: [followup], by: 'chars' });

        const followupHeight = followup.getBoundingClientRect().height;
        const brandHeight = brand.getBoundingClientRect().height;
        const clearance = (followupHeight + brandHeight) / 2 + 12;
        followup.style.setProperty('--followup-shift', `${clearance}px`);

        const characterCount = followup.querySelectorAll('.char').length;
        const step = Number.parseFloat(getComputedStyle(followup).getPropertyValue('--typewriter-step'));
        const typingDuration = matchMedia('(prefers-reduced-motion: reduce)').matches
          ? 0
          : (characterCount - 1) * step + 1;

        window.setTimeout(() => followup.classList.add('is-leaving'), typingDuration + 700);
      });

      followup.addEventListener('animationend', event => {
        if (event.target !== followup || event.animationName !== 'followup-slide-up') return;

        brand.classList.add('is-active');
        Splitting({ target: [brand], by: 'chars' });
      });

      Splitting({ target: [question], by: 'chars' });
    </script>
  </body>
 </html>
